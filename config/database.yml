default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV["MYSQL_USER"] || "root" %>
  password: <%= ENV["MYSQL_PASSWORD"] || "" %>
  host: <%= ENV["DB_HOST"] || "localhost" %>
  port: <%= ENV["DB_PORT"] || "3307" %>

development:
  <<: *default
  database: <%= ENV["MYSQL_DATABASE"] || "blog_api_development" %>

test:
  <<: *default
  database: <%= ENV["MYSQL_DATABASE"] ? "#{ENV['MYSQL_DATABASE']}_test" : "blog_api_test" %>

production:
  <<: *default
  database: <%= ENV["MYSQL_DATABASE"] || "blog_api_production" %>
  username: <%= ENV["MYSQL_USER"] || "root" %>
  password: <%= ENV["MYSQL_PASSWORD"] || "" %>
